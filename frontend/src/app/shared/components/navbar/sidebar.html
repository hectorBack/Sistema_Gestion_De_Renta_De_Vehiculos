<aside
    class="w-[260px] h-screen flex flex-col bg-white dark:bg-[#1e1e2d] border-r border-slate-200 dark:border-[#2b2b40] shadow-[4px_0_24px_rgba(0,0,0,0.02)] dark:shadow-[4px_0_24px_rgba(0,0,0,0.15)] select-none font-sans transition-all duration-300">

    <!-- Brand Header / Logo -->
    <div class="px-5 pt-6 pb-5">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-blue-700 dark:from-blue-500 dark:to-blue-700 flex items-center justify-center shadow-md shadow-blue-600/25 dark:shadow-blue-500/30">
                <mat-icon class="!w-[22px] !h-[22px] !text-[22px] text-white">directions_car</mat-icon>
            </div>
            <div class="flex flex-col">
                <span
                    class="font-extrabold text-[1.15rem] text-slate-900 dark:text-slate-100 tracking-tight leading-tight">RentCar</span>
                <span class="text-[0.72rem] text-slate-500 dark:text-slate-400 font-semibold tracking-wider">Control &
                    Gestión</span>
            </div>
        </div>
    </div>

    <mat-divider class="!border-slate-100 dark:!border-[#2b2b40]"></mat-divider>

    <!-- Navegación Principal -->
    <nav
        class="flex-1 px-3.5 py-5 overflow-y-auto [&::-webkit-scrollbar]:w-1 [&::-webkit-scrollbar-thumb]:bg-slate-200 dark:[&::-webkit-scrollbar-thumb]:bg-[#2b2b40] [&::-webkit-scrollbar-thumb]:rounded-full">

        <div class="px-3 pb-2 text-[0.68rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">
            Principal
        </div>

        <mat-nav-list class="!pt-0">
            @for (item of mainNavItems; track item.route) {
            <a mat-list-item [routerLink]="item.route" routerLinkActive="active"
                class="relative !rounded-lg !mb-1 !h-11 !text-slate-600 dark:!text-slate-400 hover:!bg-slate-50 dark:hover:!bg-[#2b2b40] hover:!text-blue-600 dark:hover:!text-blue-400 hover:translate-x-0.5 transition-all duration-200 group [&.active]:!bg-blue-50 dark:[&.active]:!bg-blue-500/15 [&.active]:!text-blue-600 dark:[&.active]:!text-blue-400 [&.active]:before:content-[''] [&.active]:before:absolute [&.active]:before:-left-3.5 [&.active]:before:top-[20%] [&.active]:before:h-[60%] [&.active]:before:w-1 [&.active]:before:rounded-r-md [&.active]:before:bg-blue-600 dark:[&.active]:before:bg-blue-400">

                <mat-icon matListItemIcon
                    class="!mr-3 !w-[20px] !h-[20px] !text-[20px] !text-slate-500 dark:!text-slate-500 group-hover:!text-blue-600 dark:group-hover:!text-blue-400 group-hover:scale-110 transition-all duration-200 [.active_&]:!text-blue-600 dark:[.active_&]:!text-blue-400">
                    {{ item.icon }}
                </mat-icon>
                <span matListItemTitle class="font-semibold text-[0.88rem] tracking-tight [.active_&]:font-bold">
                    {{ item.label }}
                </span>
            </a>
            }
        </mat-nav-list>

        <div
            class="px-3 pt-6 pb-2 text-[0.68rem] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">
            Gestión
        </div>

        <mat-nav-list class="!pt-0">
            @for (item of secondaryNavItems; track item.route) {
            <a mat-list-item [routerLink]="item.route" routerLinkActive="active"
                class="relative !rounded-lg !mb-1 !h-11 !text-slate-600 dark:!text-slate-400 hover:!bg-slate-50 dark:hover:!bg-[#2b2b40] hover:!text-blue-600 dark:hover:!text-blue-400 hover:translate-x-0.5 transition-all duration-200 group [&.active]:!bg-blue-50 dark:[&.active]:!bg-blue-500/15 [&.active]:!text-blue-600 dark:[&.active]:!text-blue-400 [&.active]:before:content-[''] [&.active]:before:absolute [&.active]:before:-left-3.5 [&.active]:before:top-[20%] [&.active]:before:h-[60%] [&.active]:before:w-1 [&.active]:before:rounded-r-md [&.active]:before:bg-blue-600 dark:[&.active]:before:bg-blue-400">

                <mat-icon matListItemIcon
                    class="!mr-3 !w-[20px] !h-[20px] !text-[20px] !text-slate-500 dark:!text-slate-500 group-hover:!text-blue-600 dark:group-hover:!text-blue-400 group-hover:scale-110 transition-all duration-200 [.active_&]:!text-blue-600 dark:[.active_&]:!text-blue-400">
                    {{ item.icon }}
                </mat-icon>
                <span matListItemTitle class="font-semibold text-[0.88rem] tracking-tight [.active_&]:font-bold">
                    {{ item.label }}
                </span>
            </a>
            }
        </mat-nav-list>
    </nav>

    <!-- Footer / Perfil Rápido + Modo Oscuro -->
    <div
        class="p-3.5 flex flex-col gap-3 bg-slate-50 dark:bg-[#181824] border-t border-slate-200 dark:border-[#2b2b40]">
        <button mat-button (click)="toggleTheme()"
            class="!w-full !flex !items-center !justify-start !gap-2.5 !px-3 !py-2 !rounded-lg !text-slate-600 dark:!text-slate-400 hover:!bg-slate-200/60 dark:hover:!bg-[#2b2b40] hover:!text-slate-900 dark:hover:!text-slate-100 !text-[0.85rem] !font-semibold transition-all duration-200">
            <mat-icon class="!w-[20px] !h-[20px] !text-[20px] !text-amber-500">
                {{ isDarkMode ? 'light_mode' : 'dark_mode' }}
            </mat-icon>
            <span>{{ isDarkMode ? 'Modo Claro' : 'Modo Oscuro' }}</span>
        </button>

        <div
            class="flex items-center gap-3 p-2.5 rounded-xl bg-white dark:bg-[#252538] border border-slate-200 dark:border-[#323248] shadow-sm">
            <div
                class="w-9 h-9 rounded-lg bg-gradient-to-br from-slate-200 to-slate-300 dark:from-[#323248] dark:to-[#2b2b40] flex items-center justify-center text-slate-600 dark:text-slate-400">
                <mat-icon class="!w-[20px] !h-[20px] !text-[20px]">person</mat-icon>
            </div>
            <div class="flex flex-col">
                <span
                    class="text-[0.84rem] font-bold text-slate-900 dark:text-slate-100 leading-tight">Administrador</span>
                <span class="text-[0.72rem] text-slate-500 dark:text-slate-400 font-medium">Sistema de Flota</span>
            </div>
        </div>
    </div>

</aside>
